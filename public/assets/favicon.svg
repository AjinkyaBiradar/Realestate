<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="24" fill="#121316"/>
  <defs>
    <linearGradient id="favAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24"/>
      <stop offset="100%" stopColor="#d97706"/>
    </linearGradient>
    <linearGradient id="favMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95"/>
      <stop offset="100%" stopColor="#94a3b8" stopOpacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- Lower Cantilever Ground Slab -->
  <polygon points="14,68 64,68 78,82 28,82" fill="url(#favMetal)" opacity="0.35"/>
  <line x1="14" y1="68" x2="64" y2="68" stroke="url(#favMetal)" strokeWidth="3" strokeLinecap="round"/>
  <!-- Structural Glass Core -->
  <line x1="40" y1="68" x2="40" y2="36" stroke="#ffffff" strokeWidth="2" strokeDasharray="3 3" opacity="0.5"/>
  <line x1="60" y1="68" x2="60" y2="36" stroke="#ffffff" strokeWidth="2" strokeDasharray="3 3" opacity="0.5"/>
  <!-- Upper Floating Cantilever Roof -->
  <polygon points="26,36 90,36 76,22 12,22" fill="url(#favMetal)" opacity="0.85"/>
  <line x1="12" y1="22" x2="76" y2="22" stroke="#ffffff" strokeWidth="3" strokeLinecap="round"/>
  <line x1="26" y1="36" x2="90" y2="36" stroke="url(#favAmber)" strokeWidth="3" strokeLinecap="round"/>
  <polyline points="76,22 90,36 90,52" stroke="url(#favAmber)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
  <!-- Glowing Hearth Core -->
  <circle cx="50" cy="52" r="6" fill="url(#favAmber)"/>
  <circle cx="50" cy="52" r="11" stroke="#f59e0b" strokeWidth="1.5" opacity="0.4"/>
</svg>
