<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="KAIROS Lakeside Sanctuary">
  <defs>
    <linearGradient id="kairos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="kairos-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="kairos-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="kairos-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Precision Matte Squircle Base -->
  <rect width="120" height="120" rx="30" fill="url(#kairos-bg)"/>
  <rect x="1" y="1" width="118" height="118" rx="29" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Minimalist Architectural Monogram 'K' -->
  <!-- Structural Pylon -->
  <rect x="34" y="28" width="11" height="64" rx="5.5" fill="url(#kairos-steel)"/>

  <!-- Upper Cantilever Wing -->
  <path d="M51 54 L76 29 C78.5 26.5 83 28.5 83 32 L83 40 C83 42.5 81.5 44.5 79.5 46 L59 62 Z" fill="url(#kairos-steel)"/>

  <!-- Lower Cantilever Terrace -->
  <path d="M51 66 L79.5 83 C81.5 84.5 83 86.5 83 89 L83 93 C83 96.5 78.5 98.5 76 96 L51 74 Z" fill="url(#kairos-steel)" opacity="0.9"/>

  <!-- Golden Sun of Kairos -->
  <circle cx="86" cy="40" r="7" fill="url(#kairos-gold)" filter="url(#kairos-glow)"/>
  <circle cx="86" cy="40" r="13" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 3" opacity="0.45"/>
</svg>
